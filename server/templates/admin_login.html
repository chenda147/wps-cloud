<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - WPS 云盘</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg:#0a0a16; --text:#e4e4ed; --text2:#8888a0; --accent:#6366f1; --accent2:#818cf8;
            --radius:12px; --radius-sm:8px; --t:all .2s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter',system-ui,sans-serif; background:var(--bg);
            background-image:radial-gradient(ellipse at 30% 30%, rgba(99,102,241,0.08) 0%, transparent 60%),
                             radial-gradient(ellipse at 70% 70%, rgba(99,102,241,0.04) 0%, transparent 50%);
            color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center;
        }
        .login-card {
            width:100%; max-width:400px; margin:20px;
            background:rgba(16,16,32,0.7); backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px);
            border:1px solid rgba(255,255,255,0.08); border-radius:20px; padding:40px 32px;
            box-shadow:0 24px 64px rgba(0,0,0,0.5);
        }
        .login-card .icon { text-align:center; margin-bottom:24px; }
        .login-card .icon i {
            width:52px; height:52px; background:linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius:14px; display:inline-flex; align-items:center; justify-content:center;
            font-size:24px; color:#fff; box-shadow:0 8px 24px rgba(99,102,241,0.4);
        }
        .login-card h2 { text-align:center; font-size:20px; margin-bottom:4px; }
        .login-card p { text-align:center; color:var(--text2); font-size:13px; margin-bottom:28px; }
        .form-group { margin-bottom:14px; position:relative; }
        .form-group i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text2); font-size:14px; }
        .form-input {
            width:100%; padding:13px 16px 13px 40px; background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,0.08); border-radius:var(--radius-sm);
            color:var(--text); font-size:14px; font-family:inherit; outline:none; transition:var(--t);
        }
        .form-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(99,102,241,0.12); }
        .form-input::placeholder { color:var(--text2); }
        .btn {
            width:100%; padding:13px; border:none; border-radius:var(--radius-sm);
            background:var(--accent); color:#fff; font-size:15px; font-weight:500;
            cursor:pointer; transition:var(--t); font-family:inherit; margin-top:6px;
        }
        .btn:hover { background:var(--accent2); box-shadow:0 4px 14px rgba(99,102,241,0.3); }
        .btn:disabled { opacity:0.6; cursor:not-allowed; }
        .err { text-align:center; color:#ef4444; font-size:13px; min-height:20px; margin-top:10px; }
        .back { text-align:center; margin-top:16px; }
        .back a { color:var(--text2); font-size:13px; text-decoration:none; }
        .back a:hover { color:var(--text); }
        @keyframes spin { to{transform:rotate(360deg)} }
        .spinner { animation:spin .8s linear infinite; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="icon"><i class="fa-solid fa-lock"></i></div>
    <h2>管理后台</h2>
    <p>请输入管理员账号登录</p>
    <form onsubmit="login(event)">
        <div class="form-group">
            <i class="fa-solid fa-user"></i>
            <input class="form-input" id="username" placeholder="用户名" value="admin" required autofocus>
        </div>
        <div class="form-group">
            <i class="fa-solid fa-key"></i>
            <input class="form-input" id="password" type="password" placeholder="密码" required>
        </div>
        <div class="err" id="errorMsg"></div>
        <button class="btn" type="submit" id="loginBtn"><i class="fa-solid fa-arrow-right-to-bracket"></i> 登录</button>
    </form>
    <div class="back"><a href="/"><i class="fa-solid fa-arrow-left"></i> 返回首页</a></div>
    <div style="text-align:center;margin-top:10px;font-size:11px;color:var(--text2);opacity:0.6;" id="buildTag">build: {{ build }}</div>
</div>
<script>
    async function login(e) {
        e.preventDefault();
        const btn = document.getElementById('loginBtn'), err = document.getElementById('errorMsg');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"><i class="fa-solid fa-circle-notch"></i></span> 登录中...';
        err.textContent = '';
        try {
            const res = await fetch('/api/login', {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({username:document.getElementById('username').value, password:document.getElementById('password').value})
            });
            const d = await res.json();
            if (d.success) { location.href = '/admin/settings'; }
            else { err.textContent = d.message || '登录失败'; }
        } catch(e) { err.textContent = '网络错误'; }
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> 登录';
    }
    document.getElementById('password').addEventListener('keydown', e=>{if(e.key==='Enter')login(e)});
</script>
</body>
</html>
